<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSYKOSMOS · Personajes</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Quill.js para el editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        /* Cargar fuentes GFS */
        @font-face {
            font-family: 'GFS';
            src: url('fonts/GFSNeohellenic.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'GFS';
            src: url('fonts/GFSNeohellenic-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'GFS', 'GFS Neohellenic', sans-serif;
            background: #0b171e;
            color: #e0f2fe;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1300px;
            background: rgba(8, 28, 36, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 2.5rem;
            padding: 28px 32px;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(45, 212, 191, 0.08);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.6rem;
            font-weight: 700;
            cursor: default;
        }

        .brand-logo img {
            height: 36px;
            width: auto;
            filter: drop-shadow(0 0 20px rgba(45, 212, 191, 0.1));
        }

        .brand-name {
            background: linear-gradient(135deg, #e0f2fe, #b6e6f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .main-content {
            padding: 10px 0;
        }

        .characters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .characters-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e4f2fa;
            font-family: 'GFS', sans-serif;
        }

        .characters-header .count {
            color: #4a6f7f;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-create, .btn-export, .btn-import {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 60px;
            font-family: 'GFS', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(45, 212, 191, 0.2);
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.15), rgba(14, 159, 142, 0.05));
            color: #ccf4ee;
        }

        .btn-create:hover, .btn-export:hover, .btn-import:hover {
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.25), rgba(14, 159, 142, 0.1));
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(45, 212, 191, 0.1);
            border-color: rgba(45, 212, 191, 0.4);
        }

        .btn-export {
            border-color: rgba(212, 45, 191, 0.2);
            background: linear-gradient(135deg, rgba(212, 45, 191, 0.15), rgba(159, 14, 142, 0.05));
            color: #f0ccf4;
        }

        .btn-export:hover {
            border-color: rgba(212, 45, 191, 0.4);
            background: linear-gradient(135deg, rgba(212, 45, 191, 0.25), rgba(159, 14, 142, 0.1));
        }

        .btn-import {
            border-color: rgba(45, 191, 212, 0.2);
            background: linear-gradient(135deg, rgba(45, 191, 212, 0.15), rgba(14, 142, 159, 0.05));
            color: #ccf0f4;
        }

        .btn-import:hover {
            border-color: rgba(45, 191, 212, 0.4);
            background: linear-gradient(135deg, rgba(45, 191, 212, 0.25), rgba(14, 142, 159, 0.1));
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            aspect-ratio: 1 / 1.1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .character-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(45, 212, 191, 0.15);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .character-card:active {
            transform: scale(0.95);
        }

        .character-card .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.15), rgba(14, 159, 142, 0.05));
            border: 2px solid rgba(45, 212, 191, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            user-select: none;
            overflow: hidden;
        }

        .character-card:hover .avatar {
            border-color: rgba(45, 212, 191, 0.3);
            transform: scale(1.05);
        }

        .character-card .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .character-card .char-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #e4f2fa;
            font-family: 'GFS', sans-serif;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .character-card .char-role {
            font-size: 0.8rem;
            color: #6a8f9f;
            font-family: 'GFS', sans-serif;
        }

        .character-card .char-status {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.7rem;
            color: #4a6f7f;
        }

        .character-card .char-actions {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
        }

        .character-card .char-actions button {
            background: rgba(255, 255, 255, 0.03);
            border: none;
            color: #4a6f7f;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 12px;
            transition: all 0.2s;
            font-family: 'GFS', sans-serif;
        }

        .character-card .char-actions button:hover {
            color: #b8d6e5;
            background: rgba(255, 255, 255, 0.05);
        }

        .character-card .char-actions button.delete:hover {
            color: #ff6b6b;
            background: rgba(255, 70, 70, 0.1);
        }

        .empty-characters {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #4a6f7f;
            font-style: italic;
            font-family: 'GFS', sans-serif;
            font-size: 1rem;
            border: 2px dashed rgba(255, 255, 255, 0.03);
            border-radius: 20px;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: #0f1f28;
            border-radius: 24px;
            padding: 32px;
            max-width: 1100px;
            width: 100%;
            max-height: 90vh;
            border: 1px solid rgba(45, 212, 191, 0.08);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e4f2fa;
            font-family: 'GFS', sans-serif;
        }

        .modal-header .close-btn {
            background: none;
            border: none;
            color: #4a6f7f;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.3s;
            font-family: 'GFS', sans-serif;
        }

        .modal-header .close-btn:hover {
            color: #ff6b6b;
        }

        .modal-body {
            display: flex;
            gap: 32px;
            flex: 1;
            overflow: hidden;
            min-height: 400px;
        }

        .modal-left {
            flex: 0 0 300px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .modal-left::-webkit-scrollbar {
            width: 4px;
        }

        .modal-left::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        .modal-left::-webkit-scrollbar-thumb {
            background: rgba(45, 212, 191, 0.2);
            border-radius: 10px;
        }

        .modal-left .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal-left .form-group label {
            color: #9bbbcb;
            font-family: 'GFS', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .modal-left .form-group input,
        .modal-left .form-group select,
        .modal-left .form-group textarea {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: #d8ecf5;
            font-family: 'GFS', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
            width: 100%;
        }

        .modal-left .form-group input:focus,
        .modal-left .form-group select:focus,
        .modal-left .form-group textarea:focus {
            border-color: rgba(45, 212, 191, 0.2);
        }

        .modal-left .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-left .form-group select option {
            background: #0f1f28;
            color: #d8ecf5;
        }

        .modal-left .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .modal-right .editor-label {
            color: #9bbbcb;
            font-family: 'GFS', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .modal-right .editor-wrapper {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }

        .modal-right .editor-wrapper .ql-toolbar.ql-snow {
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 12px;
            flex-shrink: 0;
        }

        .modal-right .editor-wrapper .ql-container.ql-snow {
            border: none;
            flex: 1;
            font-family: 'GFS', sans-serif;
        }

        .modal-right .editor-wrapper .ql-editor {
            min-height: 200px;
            color: #d8ecf5;
            font-family: 'GFS', sans-serif;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .modal-right .editor-wrapper .ql-editor strong,
        .modal-right .editor-wrapper .ql-editor b {
            font-family: 'GFS', sans-serif;
            font-weight: 700;
            color: #e4f2fa;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }

        .modal-footer button {
            padding: 10px 24px;
            border-radius: 60px;
            font-family: 'GFS', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 0.85rem;
        }

        .modal-footer .btn-save {
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.2), rgba(14, 159, 142, 0.1));
            color: #ccf4ee;
            border: 1px solid rgba(45, 212, 191, 0.2);
        }

        .modal-footer .btn-save:hover {
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.3), rgba(14, 159, 142, 0.15));
        }

        .modal-footer .btn-cancel {
            background: rgba(255, 255, 255, 0.03);
            color: #b8d6e5;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-footer .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .modal-footer .btn-delete {
            background: rgba(255, 70, 70, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.15);
            margin-right: auto;
        }

        .modal-footer .btn-delete:hover {
            background: rgba(255, 70, 70, 0.2);
            border-color: rgba(255, 70, 70, 0.3);
        }

        .modal-footer .btn-export-modal {
            background: rgba(212, 45, 191, 0.1);
            color: #f0ccf4;
            border: 1px solid rgba(212, 45, 191, 0.15);
        }

        .modal-footer .btn-export-modal:hover {
            background: rgba(212, 45, 191, 0.2);
            border-color: rgba(212, 45, 191, 0.3);
        }

        /* Input oculto */
        #bunnyImportInput {
            display: none;
        }

        @media (max-width: 900px) {
            .modal-body {
                flex-direction: column;
                overflow-y: auto;
            }

            .modal-left {
                flex: 1;
                max-height: 300px;
            }

            .modal-right {
                min-height: 300px;
            }

            .modal-content {
                padding: 20px;
                max-height: 95vh;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 16px;
                border-radius: 1.5rem;
            }

            .top-bar {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .characters-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 14px;
            }

            .character-card {
                aspect-ratio: 1 / 1.2;
                padding: 16px 12px;
            }

            .character-card .avatar {
                width: 56px;
                height: 56px;
                font-size: 1.8rem;
            }

            .character-card .char-name {
                font-size: 0.9rem;
            }

            .modal-left .form-row {
                grid-template-columns: 1fr;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions button {
                flex: 1;
                justify-content: center;
                font-size: 0.75rem;
                padding: 8px 12px;
            }
        }

        @media (max-width: 500px) {
            .characters-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }

            .character-card {
                aspect-ratio: 1 / 1.3;
                padding: 12px 8px;
            }

            .character-card .avatar {
                width: 44px;
                height: 44px;
                font-size: 1.4rem;
            }

            .character-card .char-name {
                font-size: 0.8rem;
            }

            .character-card .char-role {
                font-size: 0.65rem;
            }

            .modal-content {
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <header class="top-bar">
            <div class="brand">
                <div class="brand-logo">
                    <img src="logo.png" alt="Logo">
                </div>
                <span class="brand-name">| PSYKOSMOS</span>
            </div>
            <div style="display:flex; gap:12px; align-items:center;">
                <a href="dash.html" style="color:#7aa9c0; text-decoration:none; font-size:0.9rem; border:1px solid rgba(255,255,255,0.04); padding:6px 18px; border-radius:40px; font-family:'GFS', sans-serif;">↩ Volver</a>
            </div>
        </header>

        <main class="main-content">

            <div class="characters-header">
                <h2>
                    Personajes
                    <span class="count" id="charCount">(0)</span>
                </h2>
                <div class="header-actions">
                    <button class="btn-export" id="exportBunnyBtn">🐰 Exportar .bunny</button>
                    <button class="btn-import" id="importBunnyBtn">🐰 Importar .bunny</button>
                    <button class="btn-create" id="newCharacterBtn">+ Crear</button>
                </div>
            </div>

            <div class="characters-grid" id="charactersGrid"></div>

        </main>

    </div>

    <input type="file" id="bunnyImportInput" accept=".bunny,.json">

    <!-- MODAL -->
    <div class="modal-overlay" id="characterModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalCharTitle">📝 Nuevo personaje</h2>
                <button class="close-btn" id="modalCloseBtn">✕</button>
            </div>

            <div class="modal-body">
                <div class="modal-left">
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" id="charName" placeholder="Ej: Aria Valerius">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Edad</label>
                            <input type="text" id="charAge" placeholder="25">
                        </div>
                        <div class="form-group">
                            <label>Género</label>
                            <input type="text" id="charGender" placeholder="Femenino">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Raza / Especie</label>
                        <input type="text" id="charRace" placeholder="Humana / Elfa / etc.">
                    </div>

                    <div class="form-group">
                        <label>Ocupación / Rol</label>
                        <input type="text" id="charRole" placeholder="Guerrera, Mago, etc.">
                    </div>

                    <div class="form-group">
                        <label>Estado</label>
                        <select id="charStatus">
                            <option value="vivo">✅ Vivo</option>
                            <option value="muerto">💀 Muerto</option>
                            <option value="desaparecido">❓ Desaparecido</option>
                            <option value="desconocido">❓ Desconocido</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Avatar (PNG o GIF)</label>
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <div id="avatarPreview" style="width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.03); border: 2px solid rgba(45,212,191,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
                                <span id="avatarPlaceholder" style="font-size: 1.8rem; color: #4a6f7f;">🧙</span>
                                <img id="avatarPreviewImg" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                            </div>
                            <input type="file" id="charAvatarInput" accept="image/png,image/gif" style="flex: 1; padding: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; color: #d8ecf5; font-family: 'GFS', sans-serif; cursor: pointer;">
                            <button type="button" id="clearAvatarBtn" style="background: rgba(255,70,70,0.1); border: none; color: #ff6b6b; padding: 6px 12px; border-radius: 30px; cursor: pointer; font-family: 'GFS', sans-serif; font-size: 0.8rem;">✕</button>
                        </div>
                        <input type="hidden" id="charAvatarData" value="">
                    </div>

                    <div class="form-group">
                        <label>Notas rápidas</label>
                        <textarea id="charNotes" placeholder="Alias, lemas, etc." rows="2"></textarea>
                    </div>
                </div>

                <div class="modal-right">
                    <div class="editor-label">📖 Historia / Lore</div>
                    <div class="editor-wrapper">
                        <div id="charEditorContainer"></div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-delete" id="modalDeleteBtn">🗑 Eliminar</button>
                <button class="btn-export-modal" id="exportTxtBtn">📄 Exportar .txt</button>
                <button class="btn-export-modal" id="exportPdfBtn">📑 Exportar .pdf</button>
                <button class="btn-cancel" id="modalCancelBtn">Cancelar</button>
                <button class="btn-save" id="modalSaveBtn">💾 Guardar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script>
        (function() {
            // ----------------------------------------------
            // 1. Referencias DOM
            // ----------------------------------------------
            const grid = document.getElementById('charactersGrid');
            const charCount = document.getElementById('charCount');
            const newBtn = document.getElementById('newCharacterBtn');
            const exportBunnyBtn = document.getElementById('exportBunnyBtn');
            const importBunnyBtn = document.getElementById('importBunnyBtn');
            const bunnyImportInput = document.getElementById('bunnyImportInput');

            const modal = document.getElementById('characterModal');
            const modalTitle = document.getElementById('modalCharTitle');
            const closeBtn = document.getElementById('modalCloseBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');
            const saveBtn = document.getElementById('modalSaveBtn');
            const deleteBtn = document.getElementById('modalDeleteBtn');
            const exportTxtBtn = document.getElementById('exportTxtBtn');
            const exportPdfBtn = document.getElementById('exportPdfBtn');

            const charName = document.getElementById('charName');
            const charAge = document.getElementById('charAge');
            const charGender = document.getElementById('charGender');
            const charRace = document.getElementById('charRace');
            const charRole = document.getElementById('charRole');
            const charStatus = document.getElementById('charStatus');
            const charNotes = document.getElementById('charNotes');
            const charAvatarData = document.getElementById('charAvatarData');
            const avatarPlaceholder = document.getElementById('avatarPlaceholder');
            const avatarPreviewImg = document.getElementById('avatarPreviewImg');
            const charAvatarInput = document.getElementById('charAvatarInput');
            const clearAvatarBtn = document.getElementById('clearAvatarBtn');

            // ----------------------------------------------
            // 2. Inicializar Quill
            // ----------------------------------------------
            const quill = new Quill('#charEditorContainer', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote', 'code-block'],
                        [{ 'header': [1, 2, 3, false] }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['link', 'clean']
                    ]
                },
                placeholder: 'Escribe la historia, lore, personalidad, habilidades...'
            });

            // ----------------------------------------------
            // 3. Estado
            // ----------------------------------------------
            const STORAGE_KEY = 'psykosmos_characters';
            let characters = [];
            let currentCharId = null;
            let isEditing = false;

            // ----------------------------------------------
            // 4. Funciones de avatar (soporta PNG y GIF)
            // ----------------------------------------------
            function handleAvatarUpload(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    charAvatarData.value = dataUrl;
                    avatarPlaceholder.style.display = 'none';
                    avatarPreviewImg.src = dataUrl;
                    avatarPreviewImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }

            function loadAvatarPreview(dataUrl) {
                if (dataUrl && (dataUrl.startsWith('data:image/png') || dataUrl.startsWith('data:image/gif'))) {
                    avatarPlaceholder.style.display = 'none';
                    avatarPreviewImg.src = dataUrl;
                    avatarPreviewImg.style.display = 'block';
                    charAvatarData.value = dataUrl;
                } else {
                    clearAvatar();
                }
            }

            function clearAvatar() {
                avatarPlaceholder.style.display = 'block';
                avatarPreviewImg.style.display = 'none';
                avatarPreviewImg.src = '';
                charAvatarData.value = '';
                charAvatarInput.value = '';
            }

            // ----------------------------------------------
            // 5. Funciones CRUD
            // ----------------------------------------------
            function loadCharacters() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        characters = JSON.parse(stored);
                        characters = characters.filter(c => c && typeof c === 'object');
                        characters.forEach(c => {
                            if (!c.id) c.id = Date.now() + '_' + Math.random().toString(36).slice(2,6);
                            if (!c.status) c.status = 'vivo';
                            if (!c.created) c.created = new Date().toISOString();
                            if (!c.updated) c.updated = new Date().toISOString();
                            if (!c.lore) c.lore = '<p>Escribe la historia de tu personaje aquí...</p>';
                            if (!c.avatar) c.avatar = null;
                        });
                    } else {
                        characters = [{
                            id: 'char1_' + Date.now(),
                            name: 'Enrique',
                            age: '67',
                            gender: 'Sexual',
                            race: 'Teletubbie',
                            role: 'Prostituto',
                            status: 'vivo',
                            avatar: null,
                            notes: 'Hola',
                            lore: '<p>Joer... <strong>ENRIQUE!</strong>.</p>',
                            created: new Date().toISOString(),
                            updated: new Date().toISOString()
                        }];
                    }
                } catch(e) {
                    characters = [];
                }
                renderGrid();
            }

            function saveCharacters() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(characters));
                } catch(e) {
                    console.warn('No se pudo guardar en localStorage', e);
                }
                renderGrid();
            }

            function getCharacterById(id) {
                return characters.find(c => c.id === id);
            }

            function deleteCharacter(id) {
                if (!confirm(`¿Eliminar al personaje "${characters.find(c => c.id === id)?.name || 'sin nombre'}"?`)) return;
                characters = characters.filter(c => c.id !== id);
                if (currentCharId === id) {
                    currentCharId = null;
                }
                saveCharacters();
                if (modal.classList.contains('show')) {
                    modal.classList.remove('show');
                }
            }

            // ----------------------------------------------
            // 6. Renderizar Grid
            // ----------------------------------------------
            function renderGrid() {
                charCount.textContent = `(${characters.length})`;

                if (characters.length === 0) {
                    grid.innerHTML = `<div class="empty-characters">👀 No hay personajes aún.<br>Crea uno con el botón "+ Crear"</div>`;
                    return;
                }

                let html = '';
                const sorted = [...characters].sort((a, b) => new Date(b.updated || 0) - new Date(a.updated || 0));

                sorted.forEach(ch => {
                    const statusEmoji = {
                        'vivo': '✅',
                        'muerto': '💀',
                        'desaparecido': '❓',
                        'desconocido': '❓'
                    }[ch.status] || '❓';

                    const avatarHtml = ch.avatar && (ch.avatar.startsWith('data:image/png') || ch.avatar.startsWith('data:image/gif'))
                        ? `<img src="${ch.avatar}" alt="${ch.name}">` 
                        : '🧙‍♀️';

                    html += `
                        <div class="character-card" data-char-id="${ch.id}">
                            <div class="avatar">${avatarHtml}</div>
                            <div class="char-name">${ch.name || 'Sin nombre'}</div>
                            <div class="char-role">${ch.role || 'Sin rol'}</div>
                            <div class="char-status">${statusEmoji}</div>
                            <div class="char-actions">
                                <button class="edit-btn" data-id="${ch.id}" title="Editar">✏️</button>
                                <button class="delete-btn" data-id="${ch.id}" title="Eliminar">🗑</button>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;

                document.querySelectorAll('.character-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('button')) return;
                        const id = this.dataset.charId;
                        openCharacter(id);
                    });
                });

                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        openCharacter(id);
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        deleteCharacter(id);
                    });
                });
            }

            // ----------------------------------------------
            // 7. Abrir / Guardar personaje en modal
            // ----------------------------------------------
            function openCharacter(id) {
                const ch = getCharacterById(id);
                if (!ch) return;

                currentCharId = id;
                isEditing = true;

                modalTitle.textContent = `✏️ ${ch.name || 'Sin nombre'}`;

                charName.value = ch.name || '';
                charAge.value = ch.age || '';
                charGender.value = ch.gender || '';
                charRace.value = ch.race || '';
                charRole.value = ch.role || '';
                charStatus.value = ch.status || 'vivo';
                
                if (ch.avatar && (ch.avatar.startsWith('data:image/png') || ch.avatar.startsWith('data:image/gif'))) {
                    loadAvatarPreview(ch.avatar);
                } else {
                    clearAvatar();
                }
                
                charNotes.value = ch.notes || '';
                quill.root.innerHTML = ch.lore || '<p>Escribe la historia de tu personaje aquí...</p>';

                deleteBtn.style.display = 'inline-block';
                modal.classList.add('show');
            }

            function openNewCharacter() {
                currentCharId = null;
                isEditing = false;

                modalTitle.textContent = '📝 Nuevo personaje';

                charName.value = '';
                charAge.value = '';
                charGender.value = '';
                charRace.value = '';
                charRole.value = '';
                charStatus.value = 'vivo';
                clearAvatar();
                charNotes.value = '';
                quill.root.innerHTML = '<p>Escribe la historia de tu personaje aquí...</p>';

                deleteBtn.style.display = 'none';
                modal.classList.add('show');
                charName.focus();
            }

            function saveCurrentCharacter() {
                const name = charName.value.trim() || 'Sin nombre';

                const data = {
                    name: name,
                    age: charAge.value.trim(),
                    gender: charGender.value.trim(),
                    race: charRace.value.trim(),
                    role: charRole.value.trim(),
                    status: charStatus.value,
                    avatar: charAvatarData.value || null,
                    notes: charNotes.value.trim(),
                    lore: quill.root.innerHTML || '<p>Escribe la historia de tu personaje aquí...</p>',
                    updated: new Date().toISOString()
                };

                if (isEditing && currentCharId) {
                    const existing = getCharacterById(currentCharId);
                    if (existing) {
                        Object.assign(existing, data);
                    }
                } else {
                    const newChar = {
                        id: 'char_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
                        ...data,
                        created: new Date().toISOString()
                    };
                    characters.push(newChar);
                    currentCharId = newChar.id;
                }

                saveCharacters();
                modal.classList.remove('show');
            }

            // ----------------------------------------------
            // 8. Exportar .bunny (todos los personajes)
            // ----------------------------------------------
            function exportBunny() {
                if (characters.length === 0) {
                    alert('No hay personajes para exportar.');
                    return;
                }

                const bunnyData = {
                    version: '1.0',
                    exportedAt: new Date().toISOString(),
                    totalCharacters: characters.length,
                    characters: characters.map(ch => ({
                        id: ch.id,
                        name: ch.name,
                        age: ch.age,
                        gender: ch.gender,
                        race: ch.race,
                        role: ch.role,
                        status: ch.status,
                        avatar: ch.avatar || null,
                        notes: ch.notes,
                        lore: ch.lore,
                        created: ch.created,
                        updated: ch.updated
                    }))
                };

                const json = JSON.stringify(bunnyData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `psykosmos_characters_${new Date().toISOString().slice(0,10)}.bunny`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // ----------------------------------------------
            // 9. Importar .bunny
            // ----------------------------------------------
            function importBunny() {
                bunnyImportInput.click();
            }

            function handleBunnyImport(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        if (!data.version || !data.characters || !Array.isArray(data.characters)) {
                            alert('⚠️ El archivo no es un .bunny válido.');
                            return;
                        }

                        if (!confirm(`¿Importar ${data.characters.length} personajes?\nEsto reemplazará TODOS tus personajes actuales.`)) return;

                        characters = data.characters.map(ch => ({
                            id: ch.id || 'char_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
                            name: ch.name || 'Sin nombre',
                            age: ch.age || '',
                            gender: ch.gender || '',
                            race: ch.race || '',
                            role: ch.role || '',
                            status: ch.status || 'vivo',
                            avatar: ch.avatar || null,
                            notes: ch.notes || '',
                            lore: ch.lore || '<p>Personaje importado...</p>',
                            created: ch.created || new Date().toISOString(),
                            updated: new Date().toISOString()
                        }));

                        saveCharacters();
                        
                        if (characters.length > 0) {
                            currentCharId = characters[0].id;
                            openCharacter(currentCharId);
                        }

                        alert(`✅ ¡Importación exitosa! Se importaron ${characters.length} personajes.`);

                    } catch(err) {
                        alert('⚠️ Error al leer el archivo.');
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            }

            // ----------------------------------------------
            // 10. Exportar .TXT (personaje actual)
            // ----------------------------------------------
            function exportTxt() {
                if (!currentCharId) {
                    alert('Abre un personaje primero.');
                    return;
                }
                const ch = getCharacterById(currentCharId);
                if (!ch) return;

                const content = `NOMBRE: ${ch.name || 'Sin nombre'}
EDAD: ${ch.age || 'N/A'}
GÉNERO: ${ch.gender || 'N/A'}
RAZA: ${ch.race || 'N/A'}
ROL: ${ch.role || 'N/A'}
ESTADO: ${ch.status || 'N/A'}
NOTAS: ${ch.notes || 'N/A'}

=== HISTORIA / LORE ===
${quill.getText().trim() || 'Sin contenido.'}

--- Exportado desde PSYKOSMOS ---`;

                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${ch.name || 'personaje'}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // ----------------------------------------------
            // 11. Exportar .PDF (con imagen)
            // ----------------------------------------------
            function exportPdf() {
                if (!currentCharId) {
                    alert('Abre un personaje primero.');
                    return;
                }
                const ch = getCharacterById(currentCharId);
                if (!ch) return;

                const printWindow = window.open('', '_blank', 'width=800,height=600');
                if (!printWindow) {
                    alert('Permite ventanas emergentes para exportar PDF.');
                    return;
                }

                const avatarHtml = ch.avatar && (ch.avatar.startsWith('data:image/png') || ch.avatar.startsWith('data:image/gif'))
                    ? `<img src="${ch.avatar}" style="width:120px; height:120px; border-radius:50%; object-fit:cover; border:2px solid rgba(45,212,191,0.2);">`
                    : `<div style="width:120px; height:120px; border-radius:50%; background:rgba(45,212,191,0.1); display:flex; align-items:center; justify-content:center; font-size:4rem; border:2px solid rgba(45,212,191,0.2);">🧙</div>`;

                const printStyles = `
                    @font-face {
                        font-family: 'GFS';
                        src: url('fonts/GFSNeohellenic.ttf') format('truetype');
                        font-weight: 400;
                        font-style: normal;
                    }
                    @font-face {
                        font-family: 'GFS';
                        src: url('fonts/GFSNeohellenic-Bold.ttf') format('truetype');
                        font-weight: 700;
                        font-style: normal;
                    }
                    body {
                        font-family: 'GFS', sans-serif;
                        background: #0b171e;
                        color: #e0f2fe;
                        padding: 40px;
                        max-width: 800px;
                        margin: 0 auto;
                    }
                    .header {
                        display: flex;
                        gap: 30px;
                        align-items: center;
                        border-bottom: 2px solid rgba(45,212,191,0.2);
                        padding-bottom: 20px;
                        margin-bottom: 24px;
                    }
                    .header .info h1 {
                        font-size: 2rem;
                        color: #e4f2fa;
                        margin-bottom: 4px;
                    }
                    .header .info .sub {
                        color: #7aa9c0;
                        font-size: 1rem;
                    }
                    .details {
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 8px 20px;
                        background: rgba(255,255,255,0.02);
                        padding: 16px 20px;
                        border-radius: 12px;
                        margin-bottom: 24px;
                    }
                    .details .label {
                        color: #6a8f9f;
                        font-size: 0.75rem;
                        text-transform: uppercase;
                        letter-spacing: 1px;
                    }
                    .details .value {
                        color: #d8ecf5;
                        font-size: 1rem;
                    }
                    .lore {
                        border-top: 1px solid rgba(255,255,255,0.04);
                        padding-top: 20px;
                        margin-top: 8px;
                    }
                    .lore h3 {
                        color: #9bbbcb;
                        font-size: 0.85rem;
                        text-transform: uppercase;
                        letter-spacing: 2px;
                        margin-bottom: 12px;
                    }
                    .lore .content {
                        color: #d8ecf5;
                        line-height: 1.7;
                        font-size: 0.95rem;
                    }
                    .lore .content strong, .lore .content b {
                        font-weight: 700;
                        color: #e4f2fa;
                    }
                    .footer {
                        margin-top: 40px;
                        text-align: center;
                        font-size: 0.7rem;
                        color: #4a6f7f;
                        border-top: 1px solid rgba(255,255,255,0.03);
                        padding-top: 20px;
                    }
                `;

                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>${ch.name || 'Personaje'}</title>
                        <style>${printStyles}</style>
                    </head>
                    <body>
                        <div class="header">
                            ${avatarHtml}
                            <div class="info">
                                <h1>${ch.name || 'Sin nombre'}</h1>
                                <div class="sub">${ch.role || 'Sin rol'} · ${ch.race || 'Sin raza'}</div>
                            </div>
                        </div>
                        <div class="details">
                            <div><span class="label">Edad</span><br><span class="value">${ch.age || 'N/A'}</span></div>
                            <div><span class="label">Género</span><br><span class="value">${ch.gender || 'N/A'}</span></div>
                            <div><span class="label">Raza</span><br><span class="value">${ch.race || 'N/A'}</span></div>
                            <div><span class="label">Estado</span><br><span class="value">${ch.status || 'N/A'}</span></div>
                            ${ch.notes ? `<div style="grid-column: 1 / -1;"><span class="label">Notas</span><br><span class="value">${ch.notes}</span></div>` : ''}
                        </div>
                        <div class="lore">
                            <h3>📖 Historia / Lore</h3>
                            <div class="content">${quill.root.innerHTML || 'Sin contenido.'}</div>
                        </div>
                        <div class="footer">PSYKOSMOS · ${new Date().toLocaleDateString()}</div>
                        <script>
                            window.onload = function() {
                                setTimeout(function() { window.print(); }, 500);
                            }
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            }

            // ----------------------------------------------
            // 12. Eventos
            // ----------------------------------------------
            newBtn.addEventListener('click', openNewCharacter);

            closeBtn.addEventListener('click', function() {
                modal.classList.remove('show');
            });

            cancelBtn.addEventListener('click', function() {
                modal.classList.remove('show');
            });

            saveBtn.addEventListener('click', saveCurrentCharacter);

            deleteBtn.addEventListener('click', function() {
                if (currentCharId) {
                    deleteCharacter(currentCharId);
                }
            });

            exportTxtBtn.addEventListener('click', exportTxt);
            exportPdfBtn.addEventListener('click', exportPdf);
            exportBunnyBtn.addEventListener('click', exportBunny);
            importBunnyBtn.addEventListener('click', importBunny);

            bunnyImportInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    handleBunnyImport(this.files[0]);
                    this.value = '';
                }
            });

            charAvatarInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    const file = this.files[0];
                    if (file.type === 'image/png' || file.type === 'image/gif') {
                        handleAvatarUpload(file);
                    } else {
                        alert('⚠️ Solo se permiten archivos PNG o GIF.');
                        this.value = '';
                    }
                }
            });

            clearAvatarBtn.addEventListener('click', clearAvatar);

            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('show')) {
                    modal.classList.remove('show');
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's' && modal.classList.contains('show')) {
                    e.preventDefault();
                    saveCurrentCharacter();
                }
            });

            // ----------------------------------------------
            // 13. Inicializar
            // ----------------------------------------------
            loadCharacters();

        })();
    </script>

</body>
</html>
